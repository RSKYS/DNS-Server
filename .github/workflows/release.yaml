name: Attach .deb release asset

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-deb:
    name: Build and upload .deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate stable release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "${GITHUB_OUTPUT}"
            echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
            echo "Using stable release tag: ${tag}"
          else
            echo "stable=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping non-stable or pre-release tag: ${tag}"
          fi

      - name: Build Debian package with existing Makefile
        if: steps.tag.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -e PACKAGE_VERSION='${{ steps.tag.outputs.version }}' \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            debian:bookworm-slim \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                dpkg-dev \
                file \
                g++ \
                libcap2-bin \
                libssl-dev \
                make \
                pkg-config

              package_name="dns-server"
              binary_name="dns_server"
              service_name="dns-server.service"
              version="${PACKAGE_VERSION}"
              arch="$(dpkg --print-architecture)"
              dist_dir="dist"
              root="${dist_dir}/debroot"
              deb_file="${dist_dir}/${package_name}_${version}_${arch}.deb"

              rm -rf "${dist_dir}" debian
              mkdir -p \
                "${root}/DEBIAN" \
                "${root}/etc/dns_server" \
                "${root}/usr/bin" \
                "${root}/usr/lib/systemd/system"

              make clean
              make build
              make service-deploy

              install -m 0755 "${binary_name}" "${root}/usr/bin/${binary_name}"
              install -m 0644 "${service_name}" "${root}/usr/lib/systemd/system/${service_name}"
              : > "${root}/etc/dns_server/config"
              chmod 0644 "${root}/etc/dns_server/config"

              printf "%s\n" "/etc/dns_server/config" > "${root}/DEBIAN/conffiles"

              {
                printf "%s\n" "#!/bin/sh"
                printf "%s\n" "set -e"
                printf "%s\n" ""
                printf "%s\n" "if command -v setcap >/dev/null 2>&1; then"
                printf "%s\n" "    setcap cap_net_bind_service=+ep /usr/bin/dns_server || true"
                printf "%s\n" "fi"
                printf "%s\n" ""
                printf "%s\n" "if command -v systemctl >/dev/null 2>&1; then"
                printf "%s\n" "    systemctl daemon-reload >/dev/null 2>&1 || true"
                printf "%s\n" "fi"
                printf "%s\n" ""
                printf "%s\n" "exit 0"
              } > "${root}/DEBIAN/postinst"

              {
                printf "%s\n" "#!/bin/sh"
                printf "%s\n" "set -e"
                printf "%s\n" ""
                printf "%s\n" "if [ \"\$1\" = \"remove\" ] || [ \"\$1\" = \"deconfigure\" ]; then"
                printf "%s\n" "    if command -v systemctl >/dev/null 2>&1; then"
                printf "%s\n" "        systemctl stop dns-server.service >/dev/null 2>&1 || true"
                printf "%s\n" "        systemctl disable dns-server.service >/dev/null 2>&1 || true"
                printf "%s\n" "    fi"
                printf "%s\n" "fi"
                printf "%s\n" ""
                printf "%s\n" "exit 0"
              } > "${root}/DEBIAN/prerm"

              {
                printf "%s\n" "#!/bin/sh"
                printf "%s\n" "set -e"
                printf "%s\n" ""
                printf "%s\n" "if command -v systemctl >/dev/null 2>&1; then"
                printf "%s\n" "    systemctl daemon-reload >/dev/null 2>&1 || true"
                printf "%s\n" "fi"
                printf "%s\n" ""
                printf "%s\n" "if [ \"\$1\" = \"purge\" ]; then"
                printf "%s\n" "    rm -rf /etc/dns_server"
                printf "%s\n" "fi"
                printf "%s\n" ""
                printf "%s\n" "exit 0"
              } > "${root}/DEBIAN/postrm"

              chmod 0755 \
                "${root}/DEBIAN/postinst" \
                "${root}/DEBIAN/prerm" \
                "${root}/DEBIAN/postrm"

              mkdir -p debian
              {
                printf "%s\n" "Source: ${package_name}"
                printf "%s\n" "Section: net"
                printf "%s\n" "Priority: optional"
                printf "%s\n" "Maintainer: GitHub Actions <noreply@github.com>"
                printf "%s\n" "Standards-Version: 4.7.0"
                printf "%s\n" ""
                printf "%s\n" "Package: ${package_name}"
                printf "%s\n" "Architecture: any"
                printf "%s\n" "Depends: \${shlibs:Depends}"
                printf "%s\n" "Description: Compact DNS proxy and local-record resolver"
                printf "%s\n" " Compact Linux-only DNS proxy and local-record resolver."
              } > debian/control

              shlibs_depends=""
              if shlibs_output="$(dpkg-shlibdeps -O -e "${root}/usr/bin/${binary_name}" 2>/tmp/dpkg-shlibdeps.err)"; then
                  shlibs_depends="${shlibs_output#shlibs:Depends=}"
              else
                  cat /tmp/dpkg-shlibdeps.err >&2 || true
                  shlibs_depends="libc6, libgcc-s1, libssl3 | libssl3t64, libstdc++6"
              fi

              depends="libcap2-bin"
              if [ -n "${shlibs_depends}" ]; then
                  depends="${depends}, ${shlibs_depends}"
              fi

              {
                printf "%s\n" "Package: ${package_name}"
                printf "%s\n" "Version: ${version}"
                printf "%s\n" "Section: net"
                printf "%s\n" "Priority: optional"
                printf "%s\n" "Architecture: ${arch}"
                printf "%s\n" "Maintainer: GitHub Actions <noreply@github.com>"
                printf "%s\n" "Depends: ${depends}"
                printf "%s\n" "Homepage: https://github.com/${GITHUB_REPOSITORY:-unknown/unknown}"
                printf "%s\n" "Description: Compact DNS proxy and local-record resolver"
                printf "%s\n" " A compact Linux-only DNS proxy and local-record resolver written in C++11."
                printf "%s\n" " ."
                printf "%s\n" " It installs /usr/bin/dns_server, a systemd unit named dns-server.service,"
                printf "%s\n" " and a preserved local configuration file at /etc/dns_server/config."
              } > "${root}/DEBIAN/control"

              dpkg-deb --root-owner-group --build "${root}" "${deb_file}"
              dpkg-deb --info "${deb_file}"
              sha256sum "${deb_file}"

              make clean
            '

      - name: Create GitHub Release if needed
        if: steps.tag.outputs.stable == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          if gh release view "${tag}" --json isPrerelease --jq .isPrerelease >/tmp/is-prerelease 2>/dev/null; then
            if [ "$(cat /tmp/is-prerelease)" = "true" ]; then
              echo "upload=false" >> "${GITHUB_OUTPUT}"
              echo "Skipping upload because GitHub Release ${tag} is marked as a prerelease."
              exit 0
            fi
          else
            gh release create "${tag}" \
              --title "${tag}" \
              --notes "Automated Debian package release for ${tag}." \
              --latest
          fi

          echo "upload=true" >> "${GITHUB_OUTPUT}"

      - name: Attach Debian package to GitHub Release
        if: steps.tag.outputs.stable == 'true' && steps.release.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist/*.deb --clobber
